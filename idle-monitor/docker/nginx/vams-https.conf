# Nginx Reverse Proxy Config untuk vams.gpe.web.id (HTTPS → backend port 9097)
# Letakkan di: /etc/nginx/sites-available/vams.gpe.web.id
# Symlink ke: /etc/nginx/sites-enabled/vams.gpe.web.id

# Redirect HTTP → HTTPS
server {
    listen 80;
    server_name vams.gpe.web.id;
    return 301 https://$host$request_uri;
}

# HTTPS server — reverse proxy ke backend VAMS
server {
    listen 443 ssl;
    server_name vams.gpe.web.id;

    # === SSL Certificate (sesuaikan path) ===
    ssl_certificate     /etc/letsencrypt/live/vams.gpe.web.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vams.gpe.web.id/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # === Security Headers ===
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;

    # === Proxy ke backend VAMS ===
    location / {
        proxy_pass         http://103.130.6.115:9097;

        # WAJIB: Beritahu Laravel bahwa request ini via HTTPS
        proxy_set_header   X-Forwarded-Proto  https;
        proxy_set_header   X-Forwarded-Port   443;

        # Headers standar
        proxy_set_header   Host               $host;
        proxy_set_header   X-Real-IP          $remote_addr;
        proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;

        # Buffer & timeout untuk request besar
        proxy_connect_timeout       60s;
        proxy_send_timeout          60s;
        proxy_read_timeout          60s;
        proxy_buffer_size           16k;
        proxy_buffers               4 64k;
        proxy_busy_buffers_size     128k;

        # Ukuran upload (sesuaikan jika perlu)
        client_max_body_size        50M;
    }
}
